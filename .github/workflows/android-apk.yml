name: Build Clean Player V2 Release APK
on:
  workflow_dispatch:
  push:
    branches: ['clean-player-v2-release']
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: clean-player-v2-release
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run available unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify public release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret $name is not configured. A public APK must be signed with a persistent release key."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/clean-player-v2-release.jks"
          SIGNED_APK="app/build/outputs/apk/release/clean-player-v2.apk"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          test -s "$SIGNED_APK"
      - name: Upload verified V2 release APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-player-v2-release
          path: app/build/outputs/apk/release/clean-player-v2.apk
          if-no-files-found: error
          compression-level: 0
