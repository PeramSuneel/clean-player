name: Create Clean Player V2 Release Signing Key

on:
  push:
    branches:
      - clean-player-v2-release
    paths:
      - release-signing-setup.trigger

jobs:
  create-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate permanent password-protected JKS
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing-output
          KEYSTORE="signing-output/clean-player-v2-release.jks"
          keytool -genkeypair -noprompt \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -dname "CN=Clean Player V2 Release, OU=Android, O=PeramSuneel, L=Bengaluru, ST=Karnataka, C=IN" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD
          keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          base64 -w 0 "$KEYSTORE" > signing-output/KEYSTORE_BASE64.txt
          printf '\n' >> signing-output/KEYSTORE_BASE64.txt
          printf '%s\n' \
            'Clean Player V2 permanent Android release signing key' \
            '' \
            'Download and securely retain BOTH clean-player-v2-release.jks and KEYSTORE_BASE64.txt.' \
            'Keep an additional encrypted backup. Never commit or share either file publicly.' \
            'Add the complete contents of KEYSTORE_BASE64.txt as repository Actions secret KEYSTORE_BASE64.' \
            'Keep KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD unchanged.' \
            'Losing the keystore or passwords prevents future updates from being signed with this publisher key.' \
            'Do not regenerate this key for routine releases.' \
            > signing-output/README.txt

      - name: Upload one-time signing material
        uses: actions/upload-artifact@v4
        with:
          name: clean-player-v2-signing-material
          path: signing-output/
          if-no-files-found: error
          retention-days: 90
