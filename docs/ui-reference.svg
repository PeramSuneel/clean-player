<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171a20"/><stop offset="1" stop-color="#08090c"/></linearGradient>
  <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070b" stop-opacity=".96"/><stop offset="1" stop-color="#05070b" stop-opacity="0"/></linearGradient>
  <linearGradient id="bottomFade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#05070b" stop-opacity=".96"/><stop offset="1" stop-color="#05070b" stop-opacity="0"/></linearGradient>
  <style>
    .heading{font:700 28px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#aeb7c4}
    .device{fill:#080a0e;stroke:#697384;stroke-width:3}.screen{fill:url(#bg)}
    .label{font:700 15px Arial,sans-serif;fill:#8fc5ff;letter-spacing:1.4px}
    .txt{font:15px Arial,sans-serif;fill:#fff}.small{font:12px Arial,sans-serif;fill:#d2d8e1}
    .tiny{font:10px Arial,sans-serif;fill:#aeb7c4}.muted{fill:#9aa4b2}.blue{fill:#55aaff}.stroke{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .strokeBlue{fill:none;stroke:#55aaff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .touch{fill:#202630;fill-opacity:.55;stroke:#465365;stroke-width:1}
    .rule{stroke:#46505e;stroke-width:1;stroke-dasharray:5 5}
    .measure{font:12px Arial,sans-serif;fill:#8fc5ff}
  </style>
</defs>
<rect width="1600" height="1120" fill="#11151b"/>
<text x="70" y="58" class="heading">CLEAN PLAYER — PLAYER CONTROLS REFERENCE</text>
<text x="70" y="88" class="sub">Phase 1 mockup • black / gray / blue / white • dimensions labelled in dp • overlay controls do not resize the video</text>
<text x="300" y="145" class="label">PORTRAIT • 360 × 800 dp</text>
<text x="1000" y="145" class="label">LANDSCAPE • 800 × 360 dp</text>

<!-- portrait device -->
<rect x="250" y="165" width="460" height="880" rx="42" class="device"/>
<rect x="278" y="193" width="404" height="824" rx="20" class="screen"/>
<!-- video content -->
<rect x="278" y="193" width="404" height="824" rx="20" fill="#202a38"/>
<path d="M278 690 L410 520 L510 630 L590 470 L682 575 L682 1017 L278 1017Z" fill="#26384d" opacity=".9"/>
<circle cx="565" cy="390" r="68" fill="#34485e"/>
<path d="M278 790 Q420 720 682 790 L682 1017 L278 1017Z" fill="#1b2735"/>
<text x="480" y="590" text-anchor="middle" class="small" opacity=".65">VIDEO — FULL SCREEN</text>
<!-- status bar -->
<rect x="278" y="193" width="404" height="25" fill="#05070b" opacity=".75"/>
<text x="296" y="210" class="tiny">9:41</text><text x="646" y="210" class="tiny" text-anchor="end">5G  ▰  92%</text>
<!-- top gradient and controls -->
<rect x="278" y="218" width="404" height="205" fill="url(#topFade)"/>
<path d="M302 250 l-10 10 10 10" class="stroke"/>
<text x="326" y="265" class="txt">A_Very_Long_Video_Filename…</text>
<text x="326" y="285" class="tiny">Top bar: 48dp high • filename single-line / ellipsized</text>
<!-- top row buttons -->
<g transform="translate(0,0)">
 <rect x="292" y="302" width="48" height="48" rx="12" class="touch"/><path d="M305 318 h22 M305 324 h22 M305 330 h15" class="stroke"/>
 <rect x="344" y="302" width="48" height="48" rx="12" class="touch"/><rect x="358" y="315" width="20" height="22" rx="2" class="stroke"/><path d="M358 320 h20" class="stroke"/>
 <rect x="396" y="302" width="48" height="48" rx="12" class="touch"/><path d="M409 315 h22 v22 h-22z M409 326 h22" class="stroke"/>
 <rect x="448" y="302" width="48" height="48" rx="12" class="touch"/><path d="M462 321 q0 -7 7 -7 q7 0 7 7 v9 q0 5 -7 5 q-7 0 -7 -5z M462 326 h14" class="stroke"/>
 <rect x="500" y="302" width="48" height="48" rx="12" class="touch"/><path d="M514 316 a12 12 0 1 1 -2 15 M514 316 l-1 8 8 -2" class="stroke"/>
 <rect x="552" y="302" width="48" height="48" rx="12" class="touch"/><text x="576" y="332" text-anchor="middle" class="txt">1X</text>
 <rect x="604" y="302" width="48" height="48" rx="12" class="touch"/><path d="M618 320 l10 0 M628 320 l-5 -5 M628 320 l-5 5" class="stroke"/>
</g>
<text x="292" y="370" class="tiny">One horizontal scrolling row • 48dp touch targets • 7 controls shown expanded</text>
<text x="292" y="390" class="tiny">Default: audio / subtitles / aspect / mute / chevron • Expanded adds 1X + audio-only</text>
<!-- bottom overlay -->
<rect x="278" y="760" width="404" height="257" fill="url(#bottomFade)"/>
<!-- seek row -->
<text x="296" y="830" class="small">12:34</text><text x="664" y="830" text-anchor="end" class="small">48:20</text>
<line x1="354" y1="825" x2="606" y2="825" stroke="#667383" stroke-width="4" stroke-linecap="round"/>
<line x1="354" y1="825" x2="420" y2="825" stroke="#55aaff" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="825" r="7" fill="#fff" stroke="#55aaff" stroke-width="2"/>
<!-- bottom buttons row -->
<rect x="292" y="866" width="48" height="48" rx="14" class="touch"/>
<path d="M320 879 A13 13 0 1 0 322 899 M320 879 l-1 8 8 -2" class="stroke"/>
<rect x="350" y="866" width="48" height="48" rx="14" class="touch"/>
<path d="M379 878 A13 13 0 1 0 379 902 M379 878 l-7 6 8 2" class="stroke"/><text x="374" y="895" text-anchor="middle" class="small" font-weight="bold">10</text>
<rect x="408" y="860" width="60" height="60" rx="18" fill="#267ac0" stroke="#8fc5ff"/>
<path d="M430 877 v26 l22 -13z" fill="#fff"/>
<rect x="478" y="866" width="48" height="48" rx="14" class="touch"/>
<path d="M493 878 A13 13 0 1 1 493 902 M493 878 l7 6 -8 2" class="stroke"/><text x="502" y="895" text-anchor="middle" class="small" font-weight="bold">10</text>
<rect x="536" y="866" width="48" height="48" rx="14" class="touch"/>
<path d="M550 881 l14 10 -14 10z M566 881 v20" class="stroke"/>
<text x="438" y="944" text-anchor="middle" class="tiny">5-button group • centered independently</text>
<text x="316" y="968" class="tiny">Rotation at bottom-left • 48dp target</text>
<!-- measurements portrait -->
<line x1="700" y1="218" x2="700" y2="350" class="rule"/><text x="718" y="280" class="measure">Top controls:</text><text x="718" y="298" class="measure">48dp bar + 48dp row</text>
<line x1="700" y1="825" x2="700" y2="920" class="rule"/><text x="718" y="860" class="measure">Seek row + 5-button row</text><text x="718" y="878" class="measure">portrait spacing: 8dp</text>
<text x="480" y="1038" text-anchor="middle" class="tiny">Portrait uses standard control sizing; video remains full-screen behind overlays.</text>

<!-- landscape device -->
<rect x="930" y="235" width="610" height="390" rx="38" class="device"/>
<rect x="954" y="259" width="562" height="342" rx="18" class="screen"/>
<rect x="954" y="259" width="562" height="342" rx="18" fill="#202a38"/>
<path d="M954 500 L1080 370 L1170 465 L1290 340 L1516 460 L1516 601 L954 601Z" fill="#26384d"/>
<circle cx="1370" cy="390" r="48" fill="#34485e"/>
<text x="1235" y="470" text-anchor="middle" class="small" opacity=".65">VIDEO — FULL SCREEN</text>
<!-- status and top gradient -->
<rect x="954" y="259" width="562" height="18" fill="#05070b" opacity=".75"/>
<text x="970" y="272" class="tiny">9:41</text><text x="1498" y="272" text-anchor="end" class="tiny">5G ▰ 92%</text>
<rect x="954" y="277" width="562" height="80" fill="url(#topFade)"/>
<path d="M974 295 l-7 7 7 7" class="stroke"/>
<text x="993" y="307" class="small">A_Very_Long_Video_Filename…</text>
<!-- landscape options horizontal row compact -->
<g>
 <rect x="970" y="313" width="38" height="38" rx="9" class="touch"/><path d="M980 325 h18 M980 330 h18 M980 335 h12" class="stroke"/>
 <rect x="1012" y="313" width="38" height="38" rx="9" class="touch"/><rect x="1022" y="322" width="18" height="20" rx="2" class="stroke"/>
 <rect x="1054" y="313" width="38" height="38" rx="9" class="touch"/><path d="M1064 322 h18 v20 h-18z" class="stroke"/>
 <rect x="1096" y="313" width="38" height="38" rx="9" class="touch"/><path d="M1107 325 q0 -6 6 -6 q6 0 6 6 v8 q0 4 -6 4 q-6 0 -6 -4z" class="stroke"/>
 <rect x="1138" y="313" width="38" height="38" rx="9" class="touch"/><text x="1157" y="338" text-anchor="middle" class="small">1X</text>
 <rect x="1180" y="313" width="38" height="38" rx="9" class="touch"/><path d="M1191 330 h16 M1207 330 l-5 -5 M1207 330 l-5 5" class="stroke"/>
 <text x="1230" y="337" class="tiny">one row • 38dp visuals / 48dp hit area</text>
</g>
<!-- landscape bottom gradient 80dp -->
<rect x="954" y="495" width="562" height="106" fill="url(#bottomFade)"/>
<text x="970" y="548" class="small">12:34</text><text x="1500" y="548" text-anchor="end" class="small">48:20</text>
<line x1="1035" y1="544" x2="1435" y2="544" stroke="#667383" stroke-width="3" stroke-linecap="round"/>
<line x1="1035" y1="544" x2="1140" y2="544" stroke="#55aaff" stroke-width="3" stroke-linecap="round"/>
<circle cx="1140" cy="544" r="6" fill="#fff"/>
<!-- rotation bottom left, center five buttons -->
<rect x="970" y="555" width="42" height="42" rx="11" class="touch"/><path d="M983 566 a11 11 0 1 1 -1 14 M983 566 l-1 7 7 -2" class="stroke"/>
<rect x="1165" y="555" width="42" height="42" rx="11" class="touch"/><path d="M1191 565 A10 10 0 1 0 1191 588 M1191 565 l-6 5 7 2" class="stroke"/><text x="1186" y="581" text-anchor="middle" class="tiny">10</text>
<rect x="1213" y="551" width="50" height="50" rx="14" fill="#267ac0" stroke="#8fc5ff"/><path d="M1232 563 v26 l19 -13z" fill="#fff"/>
<rect x="1269" y="555" width="42" height="42" rx="11" class="touch"/><path d="M1284 565 A10 10 0 1 1 1284 588 M1284 565 l6 5 -7 2" class="stroke"/><text x="1294" y="581" text-anchor="middle" class="tiny">10</text>
<rect x="1317" y="555" width="42" height="42" rx="11" class="touch"/><path d="M1329 565 l14 11 -14 11z M1344 565 v22" class="stroke"/>
<text x="1262" y="616" text-anchor="middle" class="tiny">Centered 5-button group • 24dp icons • 32dp play • 12sp time</text>
<!-- landscape measurements -->
<line x1="1525" y1="277" x2="1525" y2="351" class="rule"/><text x="1534" y="305" class="measure">Top ≤18%</text><text x="1534" y="322" class="measure">≈65dp</text>
<line x1="1525" y1="495" x2="1525" y2="601" class="rule"/><text x="1534" y="542" class="measure">Bottom ≤22%</text><text x="1534" y="559" class="measure">≈79dp</text>
<text x="1235" y="670" text-anchor="middle" class="tiny">Landscape: short 80dp gradient • 4–8dp seek-to-buttons gap • insets respected.</text>

<!-- legend -->
<rect x="70" y="710" width="770" height="310" rx="18" fill="#191f28" stroke="#3b4655"/>
<text x="100" y="752" class="heading" style="font-size:21px">CONTROL SPECIFICATION</text>
<text x="100" y="790" class="txt">TOP OVERLAY</text><text x="260" y="790" class="small">48dp title bar • single-line ellipsized filename • 48dp horizontal options row</text>
<text x="100" y="825" class="txt">OPTIONS</text><text x="260" y="825" class="small">Audio • Subtitles • Aspect • Mute • 1X • Audio-only • left-pointing collapse chevron</text>
<text x="100" y="860" class="txt">BOTTOM</text><text x="260" y="860" class="small">Seek/time row above centered Previous / −10 / Play / +10 / Next group</text>
<text x="100" y="895" class="txt">ROTATION</text><text x="260" y="895" class="small">Independent bottom-left control; never part of the centered five-button group</text>
<text x="100" y="930" class="txt">ICONS</text><text x="260" y="930" class="small">24dp viewport • 2dp white stroke • round caps/joins • minimum 48dp touch target</text>
<text x="100" y="965" class="txt">LANDSCAPE</text><text x="260" y="965" class="small">24dp icons • 32dp play • 12sp time • top ≤18% / bottom ≤22% of height</text>
<text x="100" y="1000" class="txt">SAFE AREAS</text><text x="260" y="1000" class="small">Status bar and camera cutout free; navigation inset respected; video stays full-screen</text>
</svg>