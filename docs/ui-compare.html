<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean Player V3 UI comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#171b20;color:#f4f6f8;font:14px Arial,sans-serif}
h1{font-size:20px;margin:0 0 8px}p{color:#b9c0c9;margin:0 0 18px}
.controls{display:flex;gap:10px;align-items:center;margin-bottom:18px}.controls button{background:#2a2a2a;color:#fff;border:1px solid #59616c;border-radius:6px;padding:9px 14px;cursor:pointer}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,843px));gap:18px;align-items:start}.panel h2{font-size:15px;font-weight:600;margin:0 0 8px}
.frame{width:100%;aspect-ratio:843/376;position:relative;background:#0c1110;border:1px solid #68717c;overflow:hidden}
.frame img,.frame object{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;border:0}
.frame .drawing{display:none}.frame.overlay .drawing{display:block;opacity:.5}
.frame.overlay .reference{display:block}
.frame img{display:block}.note{font-size:12px;color:#aeb5be;margin-top:8px}
@media(max-width:900px){.stage{grid-template-columns:1fr}.frame{max-width:843px}}
</style></head><body>
<h1>Clean Player V3 — Reference comparison</h1>
<p>Reference on the left, SVG drawing on the right. Use overlay mode to compare alignment at 50% opacity.</p>
<div class="controls"><button id="side">Side-by-side</button><button id="overlay">50% overlay</button></div>
<div class="stage">
<section class="panel"><h2>Original reference image</h2><div class="frame" id="left"><img class="reference" src="reference/player-reference.jpg" alt="Repository reference image" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div style=&quot;padding:18px;color:#ffcf9c&quot;>Reference image could not be loaded. Check docs/reference/player-reference.jpg on branch player-ui-v3.</div>')"></div><div class="note">Expected source: docs/reference/player-reference.jpg</div></section>
<section class="panel"><h2>SVG drawing</h2><div class="frame" id="right"><object class="reference" data="ui-reference-v3-landscape.svg" type="image/svg+xml" aria-label="SVG player UI drawing"></object><object class="drawing" data="ui-reference-v3-landscape.svg" type="image/svg+xml" aria-label="50 percent overlay drawing"></object></div><div class="note">Exact canvas: 843 × 376 px</div></section>
</div>
<script>
const right=document.getElementById('right');document.getElementById('side').onclick=()=>right.classList.remove('overlay');document.getElementById('overlay').onclick=()=>right.classList.add('overlay');
</script></body></html>
